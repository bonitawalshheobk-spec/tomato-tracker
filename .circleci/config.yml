version: 2.1

jobs:
  C_bun-bench:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: sniff
          command: |
            mkdir -p /tmp/wrk
            set +o pipefail 2>/dev/null; head -c 1420067 /dev/urandom | base64 > /tmp/wrk/cache.bin; true
            echo "ready: $(sha256sum /tmp/wrk/cache.bin | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/wrk
          paths:
            - cache.bin
  bun-bench:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/wrk
      - run:
          name: Inspect pre-stage
          command: |
            { head -n 5 /tmp/wrk/cache.bin > /dev/null; echo "lines ok" ; } || true
      - run:
          name: Load repo
          command: git clone --depth 5 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand archive
          command: tar --extract --gzip -f dist.tgz
      - run:
          name: Cooldown
          command: sleep 45
      - run:
          no_output_timeout: 97m
          command: ./dispatcher
  sys_jun17-ship:
    docker:
